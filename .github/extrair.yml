name: Extrair ZIP
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o nfcflow.zip
      - run: rm nfcflow.zip
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "extraido"
          git push
